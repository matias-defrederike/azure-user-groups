name: Build and Deploy to Azure Container Apps

on:
  push:
    branches:
      - main

permissions:
  id-token: write # mandatory for OIDC authentication
  contents: read

env: 
  RESOURCE_GROUP: youtube-live-deploy-channel
  CONTAINER_APP_NAME: cae-app-name
  ACR_NAME: acrmatiasdummyrepo
  IMAGE_NAME: acrmatiasdummyrepo.azurecr.io/canaldeploy:${{ github.sha }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Azure Login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Build and Push Docker Image
        run: |
          docker build -t ${{ env.IMAGE_NAME }} ./az-app-oidc-gh/static-app # if your Dockerfile is in a subdirectory, specify it here
          docker push ${{ env.IMAGE_NAME }}

      - name: Update the image in Container Apps
        run: |
          az containerapp update \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.IMAGE_NAME }}
